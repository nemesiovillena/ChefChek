name: Frontend CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

defaults:
  run:
    working-directory: frontend

jobs:
  quality:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Caché de paquetes de bun: evita descargar `next` (paquete grande) en
      # cada ejecución; su descarga fallaba a veces con
      # "Fail extracting tarball for next".
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Reintenta si aun así falla la descarga/extracción (fallo de red, no de código).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install falló (intento $attempt de 3), reintentando..."
            sleep 10
          done
          exit 1
        env:
          HUSKY: '0'

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  # Playwright E2E smoke tests. Non-blocking initially while the suite grows.
  e2e:
    name: E2E Smoke (Playwright)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Caché de paquetes de bun: evita descargar `next` (paquete grande) en
      # cada ejecución; su descarga fallaba a veces con
      # "Fail extracting tarball for next".
      - name: Cache bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      # Reintenta si aun así falla la descarga/extracción (fallo de red, no de código).
      - name: Install dependencies
        run: |
          for attempt in 1 2 3; do
            bun install --frozen-lockfile && exit 0
            echo "bun install falló (intento $attempt de 3), reintentando..."
            sleep 10
          done
          exit 1
        env:
          HUSKY: '0'

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        run: bun run test:e2e
